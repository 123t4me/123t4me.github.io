title: Affiniti Group
description: SpeakEasy STT — legal and privacy documents

# ─────────────────────────── no theme gem ───────────────────────────
# `theme: jekyll-theme-minimal` was REMOVED 2026-08-17 (Stage 1). The theme is
# now vendored into this repo -- _layouts/default.html, _includes/head-custom*,
# assets/css/style.scss, assets/js/scale.fix.js and the Noto Sans binaries under
# assets/fonts/ are all ours. The transfer was verbatim; the rendered pages did
# not change.
#
# jekyll-seo-tag MUST be declared here. The vendored _layouts/default.html calls
# {% seo %}, and that tag came from the theme gem's runtime dependency. Removing
# the theme takes the dependency with it, and an undeclared {% seo %} is an
# unknown-tag BUILD FAILURE, not a missing meta tag -- the whole site stops
# publishing. jekyll-seo-tag is on the GitHub Pages allowlist, so declaring it
# is supported.
plugins:
  - jekyll-seo-tag

# ─────────────────────────── shared copy ───────────────────────────
# Stated ONCE for the whole site. _includes/legal-footer.html and
# _layouts/legal.html read these, so changing an address or the product
# name here changes every legal document at once. Never repeat these
# values inside a document.
product: "SpeakEasy STT"
publisher: "Affiniti Group"
copyright_year: "2026"
contact_privacy: "privacy@123t4me.com"
contact_licensing: "licensing@123t4me.com"

# Nothing here is a blog. Turn off the post machinery so Jekyll does not look
# for _posts or generate feeds nobody reads.
defaults:
  - scope:
      path: ""
    values:
      layout: default

  # ── DELIBERATELY NOT ACTIVE YET (2026-08-17) ──────────────────────────────
  #
  #  - scope:
  #      path: "legal"
  #    values:
  #      layout: legal
  #
  # This block and the DOCUMENTS ARE COUPLED and must ship together. Enabling it
  # applies _layouts/legal.html to every page under /legal/, and that layout
  # renders the H1 and the mandated version line from front-matter fields
  # (product/heading/title/version/stamp/updated).
  #
  # It was enabled and pushed once WITHOUT the adapted documents, during the
  # Stage 1 theme transfer. The published documents still carried their own H1
  # and no version fields, so every legal page rendered a duplicate heading and
  # a literal "Version _ — Last updated:" with empty values. Caught by diffing
  # the live pages against a pre-change baseline; reverted within minutes.
  #
  # TO ENABLE: publish the documents and this file in the SAME run --
  #     .\scripts\Publish-LegalDocs.ps1        (no -Only)
  # which validates every document first and refuses if any lacks
  # version/stamp/updated. Until then /legal/ keeps `layout: default` from the
  # catch-all above, exactly as it rendered before the theme was vendored.
  #
  # Blocking on: version/stamp for legal/eula and legal/preview-terms.
